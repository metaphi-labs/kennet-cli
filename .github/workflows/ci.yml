name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest -q
      - run: uvx ruff@0.16.6 check .
      - run: uvx ruff@0.16.6 format --check .
      - name: build the sdist and wheel; only the package may ship
        run: |
          uv build
          bad=$( (for f in dist/*.tar.gz; do tar tzf "$f"; done; for f in dist/*.whl; do unzip -Z1 "$f"; done) \
            | grep -E '(^|/)(tests|\.github)/' || true)
          if [ -n "$bad" ]; then echo "::error::the distributions carry files that must not ship:"; echo "$bad"; exit 1; fi

  install:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: sh -n install.sh
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest -q tests/test_install.py

  binary:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: uv sync --frozen --no-dev --group release --python 3.12
      - name: pyinstaller (as release.yml)
        run: |
          uv run --frozen --no-sync pyinstaller --log-level WARN --onefile --name kennet --add-data src/metaphi/data:metaphi/data \
            src/metaphi/__main__.py
      - run: ./dist/kennet --version
      - name: kennet mcp answers over stdio, and how fast
        run: |
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          list='{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          time (printf '%s\n%s\n' "$init" "$list" | ./dist/kennet mcp > mcp.out)
          grep -q '"codeval_send"' mcp.out && grep -q '"anthropic/requiresUserInteraction":true' mcp.out
          ls -l dist/kennet

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint && ./actionlint -color
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.30.1 --offline --format plain .github/workflows

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks over the full history
        run: |
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && ./gitleaks git --redact --no-banner --log-opts="--all" .
